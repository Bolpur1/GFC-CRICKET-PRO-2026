
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GFC CRICKET PRO 2026</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;padding:0;width:100%;height:100%;
 background:transparent;
 font-family:Arial,Helvetica,sans-serif;
 color:#fff;
}

body{
 display:flex;
 align-items:flex-end;
 justify-content:center;
 overflow:hidden;
}

#broadcast{
 width:100%;
 padding:0 1%;
 --main:#123d78;
 --deep:#050d1c;
 --accent:#ffd66b;
 --light:#d9e8ff;
}

.bar{
 width:100%;
 min-height:72px;
 display:flex;
 align-items:stretch;
 position:relative;
 overflow:hidden;
 border-top:3px solid var(--accent);
 border-radius:7px 7px 0 0;
 background:
 linear-gradient(105deg,var(--main),#102747 40%,var(--deep));
 box-shadow:
 0 -5px 22px #000a,
 inset 0 1px 0 #ffffff35;
}

.bar:before{
 content:"";
 position:absolute;
 inset:0;
 pointer-events:none;
 background:
 linear-gradient(115deg,#ffffff12,transparent 30%,#ffffff05 65%,transparent);
}

/* TEAM PANELS */

.team{
 display:flex;
 align-items:center;
 gap:8px;
 padding:0 12px;
 min-width:130px;
 max-width:155px;
 background:linear-gradient(145deg,#101d32,#030813);
 position:relative;
 z-index:1;
}

.team.batting{
 border-left:3px solid var(--accent);
 border-right:1px solid #ffffff25;
}

.team.bowling{
 border-left:1px solid #ffffff25;
 border-right:3px solid var(--accent);
}

.logo{
 width:39px;
 height:39px;
 flex:0 0 39px;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 overflow:hidden;
 background:linear-gradient(145deg,#304b70,#091629);
 border:2px solid var(--accent);
 box-shadow:0 0 10px #ffd66b35;
 color:var(--accent);
 font-size:11px;
 font-weight:1000;
}

.logo img{
 width:100%;
 height:100%;
 object-fit:contain;
 display:none;
 background:#fff;
 border-radius:50%;
}

.teamname{
 font-size:11px;
 font-weight:1000;
 line-height:1.2;
 max-width:90px;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap;
}

.teamtag{
 font-size:8px;
 color:var(--accent);
 font-weight:900;
 letter-spacing:1.2px;
 margin-top:5px;
}

/* BATSMEN VERTICAL */

.batsmen{
 display:flex;
 flex-direction:column;
 justify-content:center;
 gap:7px;
 min-width:185px;
 padding:0 12px;
 border-right:1px solid #ffffff25;
 position:relative;
 z-index:1;
}

.batter{
 display:flex;
 align-items:center;
 gap:6px;
 min-width:0;
}

.batter-name{
 display:flex;
 align-items:center;
 gap:5px;
 min-width:0;
 font-size:10px;
 font-weight:900;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 max-width:105px;
}

.strike-icon{
 color:var(--accent);
 font-size:10px;
}

.batter:not(.on-strike) .strike-icon{
 display:none;
}

.batter-stats{
 font-size:10px;
 color:#c8d9f5;
 white-space:nowrap;
 font-weight:800;
 margin-left:auto;
}

.batter-stats strong{
 color:var(--accent);
 font-size:12px;
}

/* MAIN SCORE */

.main-score{
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 min-width:210px;
 padding:4px 14px;
 background:linear-gradient(145deg,#152e50,#081629);
 border-right:1px solid #ffffff30;
 position:relative;
 z-index:1;
}

.score-line{
 display:flex;
 align-items:baseline;
 justify-content:center;
 gap:5px;
}

.score{
 font-size:29px;
 line-height:1;
 font-weight:1000;
 letter-spacing:-1px;
 color:var(--accent);
 text-shadow:0 0 14px #ffd66b55;
 white-space:nowrap;
}

.overs{
 font-size:10px;
 font-weight:900;
 color:#d9e8ff;
 white-space:nowrap;
}

.score-caption{
 font-size:7px;
 letter-spacing:2px;
 color:#9fb9dc;
 font-weight:900;
 margin-top:3px;
}

.score-metrics{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:9px;
 margin-top:5px;
 width:100%;
}

.metric{
 text-align:center;
 white-space:nowrap;
}

.metric small{
 display:block;
 font-size:7px;
 color:#b9cce8;
 font-weight:900;
 letter-spacing:.5px;
 margin-bottom:2px;
}

.metric b{
 font-size:10px;
 color:var(--accent);
 font-weight:1000;
}

.metric-separator{
 height:17px;
 width:1px;
 background:#ffffff35;
}

/* BOWLER */

.bowler{
 display:flex;
 flex-direction:column;
 justify-content:center;
 min-width:105px;
 max-width:135px;
 padding:0 11px;
 border-right:1px solid #ffffff25;
 position:relative;
 z-index:1;
}

.bowler small{
 font-size:8px;
 color:var(--accent);
 font-weight:1000;
 letter-spacing:1px;
 margin-bottom:5px;
}

.bowler b{
 font-size:10px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.bowler span{
 font-size:10px;
 color:#d5e4fa;
 margin-top:5px;
 font-weight:800;
}

/* LAST BALLS */

.last{
 display:flex;
 align-items:center;
 gap:6px;
 padding:0 9px;
 flex:1;
 min-width:100px;
 position:relative;
 z-index:1;
}

.last-title{
 font-size:8px;
 line-height:1.3;
 font-weight:1000;
 color:var(--accent);
 letter-spacing:.8px;
 white-space:nowrap;
}

#lastBalls{
 display:flex;
 align-items:center;
 gap:4px;
 overflow:hidden;
}

.ball{
 width:22px;
 height:22px;
 flex:0 0 22px;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 font-size:9px;
 font-weight:1000;
 border:1px solid #ffffff45;
 box-shadow:0 2px 5px #0006;
}

.ball.dot{background:#52617a}
.ball.one{background:#2475c9}
.ball.two{background:#536b91}
.ball.three{background:#8056c5}
.ball.four{background:#0878e7;border-color:#83caff}
.ball.six{background:#07975e;border-color:#70efb6}
.ball.wicket{background:#d51e3c;border-color:#ff8b9a}
.ball.wide{background:#a34acb;border-color:#e0aaff}
.ball.noball{background:#e07819;border-color:#ffc17a}
.ball.extra{background:#8056c5}
.ball.other{background:#536078}

/* THEMES */

.classic{--main:#123d78;--deep:#050d1c;--accent:#ffd66b}
.modern{--main:#5422a0;--deep:#180d3a;--accent:#d2a9ff}
.red{--main:#a30d2a;--deep:#300812;--accent:#ff7884}
.gold{--main:#705018;--deep:#1c1408;--accent:#ffdb80}
.neon{--main:#005a76;--deep:#001a29;--accent:#00edff}
.purple{--main:#146b43;--deep:#05291d;--accent:#caff72}
.orange{--main:#a63c0a;--deep:#351306;--accent:#ffc06b}
.royal{--main:#007b61;--deep:#042c27;--accent:#75ffd0}
.blackgold{--main:#303030;--deep:#080808;--accent:#f2d276}
.emerald{--main:#0755a9;--deep:#071b42;--accent:#69c9ff}
.pink{--main:#9d1b82;--deep:#300b31;--accent:#ff9ae4}
.ice{--main:#64798c;--deep:#1b2939;--accent:#e7f5ff}
.cyber{--main:#4b176c;--deep:#110b24;--accent:#eaff00}
.stadium{--main:#54208b;--deep:#1a0c38;--accent:#e0bdff}
.minimal{--main:#252b3a;--deep:#080b14;--accent:#e8c76a}
.retro{--main:#a9360a;--deep:#391007;--accent:#ffcf68}
.tv{--main:#343434;--deep:#111;--accent:#f7ec63}
.gradient{--main:#125c9b;--deep:#071a36;--accent:#7df8ef}
.league{--main:#243e71;--deep:#111d36;--accent:#ffd06b}
.matrix{--main:#07522b;--deep:#001b0c;--accent:#aaff68}

/* RESPONSIVE */

@media(max-width:1200px){
 .team{min-width:105px;padding:0 7px;gap:5px}
 .logo{width:31px;height:31px;flex-basis:31px}
 .teamname{font-size:9px;max-width:65px}
 .batsmen{min-width:155px;padding:0 7px}
 .batter-name{font-size:9px;max-width:85px}
 .main-score{min-width:185px;padding:4px 8px}
 .score{font-size:25px}
 .score-metrics{gap:6px}
 .metric b{font-size:9px}
 .bowler{min-width:90px;padding:0 7px}
 .last{padding:0 5px;gap:4px}
 .ball{width:19px;height:19px;flex-basis:19px;font-size:8px}
}

@media(max-width:900px){
 .team{min-width:80px;padding:0 5px;gap:4px}
 .logo{width:25px;height:25px;flex-basis:25px}
 .teamname{font-size:8px;max-width:48px}
 .teamtag{font-size:6px}
 .batsmen{min-width:140px;padding:0 5px;gap:6px}
 .batter-name{font-size:8px;max-width:75px}
 .batter-stats{font-size:8px}
 .batter-stats strong{font-size:10px}
 .main-score{min-width:165px;padding:4px 5px}
 .score{font-size:22px}
 .overs{font-size:8px}
 .score-metrics{gap:4px}
 .metric small{font-size:6px}
 .metric b{font-size:8px}
 .bowler{min-width:75px;padding:0 5px}
 .bowler b,.bowler span{font-size:8px}
 .last-title{font-size:7px}
 .ball{width:17px;height:17px;flex-basis:17px;font-size:7px}
}
</style>
</head>

<body>
<div id="broadcast" class="classic">
<div class="bar">

 <!-- BATTING TEAM -->
 <div class="team batting">
  <div class="logo">
   <img id="batLogo" alt="">
   <span id="batInitial">BAT</span>
  </div>
  <div>
   <div class="teamname" id="batTeam">BATTING</div>
   <div class="teamtag">BATTING</div>
  </div>
 </div>

 <!-- BATSMEN: TOP AND BOTTOM -->
 <div class="batsmen">

  <div class="batter on-strike">
   <div class="batter-name">
    <span class="strike-icon">▶</span>
    <span id="striker">Striker</span>
   </div>
   <div class="batter-stats">
    <strong id="strikerRuns">0</strong>
    (<span id="strikerBalls">0</span>)
   </div>
  </div>

  <div class="batter">
   <div class="batter-name">
    <span id="nonStriker">Non Striker</span>
   </div>
   <div class="batter-stats">
    <strong id="nonRuns">0</strong>
    (<span id="nonBalls">0</span>)
   </div>
  </div>

 </div>

 <!-- MAIN SCORE AND METRICS BELOW -->
 <div class="main-score">

  <div class="score-line">
   <span class="score" id="score">0/0</span>
   <span class="overs" id="overs">0.0 OV</span>
  </div>

  <div class="score-caption">GFC LIVE SCORE</div>

  <div class="score-metrics">
   <div class="metric">
    <small>CRR</small>
    <b id="crr">0.00</b>
   </div>

   <div class="metric-separator"></div>

   <div class="metric">
    <small>PROJECTED</small>
    <b id="projected">0</b>
   </div>

   <div class="metric-separator"></div>

   <div class="metric">
    <small>TARGET</small>
    <b id="target">--</b>
   </div>

   <div class="metric-separator"></div>

   <div class="metric">
    <small>RRR</small>
    <b id="rrr">--</b>
   </div>
  </div>

 </div>

 <!-- BOWLER -->
 <div class="bowler">
  <small>BOWLING</small>
  <b id="bowler">Bowler</b>
  <span id="bowlerStats">0/0 (0.0)</span>
 </div>

 <!-- LAST BALLS -->
 <div class="last">
  <div class="last-title">LAST<br>6 BALLS</div>
  <div id="lastBalls">
   <span class="ball dot">-</span>
  </div>
 </div>

 <!-- BOWLING TEAM -->
 <div class="team bowling">
  <div>
   <div class="teamname" id="bowlTeam">BOWLING</div>
   <div class="teamtag">BOWLING</div>
  </div>
  <div class="logo">
   <img id="bowlLogo" alt="">
   <span id="bowlInitial">BWL</span>
  </div>
 </div>

</div>
</div>

<script>
const SUPABASE_URL="https://shlvtaxrkyffdifbjswq.supabase.co";
const SUPABASE_KEY="sb_publishable_m11Q7ccOj1iQf_HB1zZ4bg_0GpxW0lC";

const db=window.supabase.createClient(
 SUPABASE_URL,SUPABASE_KEY
);

const params=new URLSearchParams(location.search);
const matchId=params.get("match");
const design=params.get("design")||"classic";

const themes=[
 "classic","modern","red","gold","neon","purple","orange",
 "royal","blackgold","emerald","pink","ice","cyber","stadium",
 "minimal","retro","tv","gradient","league","matrix"
];

document.getElementById("broadcast").className=
 themes.includes(design)?design:"classic";

const $=id=>document.getElementById(id);

function overText(b){
 return Math.floor(b/6)+"."+(b%6);
}

function legal(d){
 return !["wide","no_ball"].includes(
  (d.extra_type||"none").toLowerCase()
 );
}

function extras(d){
 return Number(d.extra_runs||0);
}

function scoreOf(ds){
 let r=0,w=0,b=0;

 ds.forEach(d=>{
  r+=Number(d.batter_runs||0)+extras(d);
  if(d.is_wicket)w++;
  if(legal(d))b++;
 });

 return {r,w,b};
}

function batter(ds,id){
 let r=0,b=0;

 ds.forEach(d=>{
  if(!id||d.striker_id!==id)return;

  r+=Number(d.batter_runs||0);

  if((d.extra_type||"none").toLowerCase()!=="wide")b++;
 });

 return {r,b};
}

function bowlerFigures(ds,id){
 let r=0,w=0,b=0;

 ds.forEach(d=>{
  if(!id||d.bowler_id!==id)return;

  const type=(d.extra_type||"none").toLowerCase();

  r+=Number(d.batter_runs||0);

  if(type==="wide"||type==="no_ball")r+=extras(d);

  if(legal(d))b++;

  if(d.is_wicket&&![
   "run out","retired hurt","obstructing the field","retired out"
  ].includes((d.wicket_type||"").toLowerCase()))w++;
 });

 return {r,w,b};
}

function ballText(d){
 if(d.is_wicket)return "W";

 const r=Number(d.batter_runs||0);
 const e=extras(d);
 const type=(d.extra_type||"none").toLowerCase();

 if(type==="wide")return "Wd";
 if(type==="no_ball")return "Nb";
 if(type==="bye")return "B"+e;
 if(type==="leg_bye")return "Lb"+e;

 return String(r);
}

function ballClass(d){
 if(d.is_wicket)return "wicket";

 const type=(d.extra_type||"none").toLowerCase();

 if(type==="wide")return "wide";
 if(type==="no_ball")return "noball";
 if(type==="bye"||type==="leg_bye")return "extra";

 const r=Number(d.batter_runs||0);

 if(r===0)return "dot";
 if(r===1)return "one";
 if(r===2)return "two";
 if(r===3)return "three";
 if(r===4)return "four";
 if(r===6)return "six";

 return "other";
}

function setLogo(imageId,initialId,url,name){
 const img=$(imageId);
 const fallback=$(initialId);

 img.style.display="none";
 fallback.style.display="block";

 fallback.textContent=
  (name||"GFC").trim().substring(0,3).toUpperCase();

 if(url){
  img.onload=()=>{
   img.style.display="block";
   fallback.style.display="none";
  };

  img.onerror=()=>{
   img.style.display="none";
   fallback.style.display="block";
  };

  img.src=url;
 }
}

/* SIX LEGAL BALLS + EXTRA DELIVERY SLOTS */
function renderLastBalls(ds){
 const legalIndexes=[];

 ds.forEach((d,i)=>{
  if(legal(d))legalIndexes.push(i);
 });

 const lastSix=legalIndexes.slice(-6);
 let selected=[];

 if(lastSix.length){
  selected=ds.slice(lastSix[0]);
 }else{
  selected=ds.slice(-6);
 }

 $("lastBalls").innerHTML=selected.length?
  selected.map(d=>
   `<span class="ball ${ballClass(d)}" title="${ballText(d)}">${ballText(d)}</span>`
  ).join("")
  :'<span class="ball dot">-</span>';
}

let refreshing=false;

async function refresh(){
 if(refreshing)return;
 refreshing=true;

 try{
  if(!matchId)throw new Error("Missing match ID");

  const {data:m,error:me}=await db
   .from("gfc_matches")
   .select("*")
   .eq("id",matchId)
   .single();

  if(me)throw me;

  const {data:teams,error:te}=await db
   .from("gfc_teams")
   .select("*")
   .in("id",[m.team_a_id,m.team_b_id]);

  if(te)throw te;

  const tm={};
  (teams||[]).forEach(t=>tm[t.id]=t);

  const {data:innings,error:ie}=await db
   .from("gfc_innings")
   .select("*")
   .eq("match_id",matchId)
   .order("innings_no",{ascending:false})
   .limit(1);

  if(ie)throw ie;

  const inn=innings?.[0];
  if(!inn)return;

  const {data:ds0,error:de}=await db
   .from("gfc_deliveries")
   .select("*")
   .eq("innings_id",inn.id)
   .order("created_at",{ascending:true});

  if(de)throw de;

  const ds=ds0||[];
  const calc=scoreOf(ds);

  const runs=Number(inn.total_runs??calc.r);
  const wickets=Number(inn.wickets??calc.w);
  const balls=Number(inn.legal_balls??calc.b);

  /* BATTING AND BOWLING TEAM */
  const battingId=inn.batting_team_id||m.batting_team_id||m.team_a_id;

  const bowlingId=
   battingId===m.team_a_id?m.team_b_id:m.team_a_id;

  const battingTeam=tm[battingId];
  const bowlingTeam=tm[bowlingId];

  $("batTeam").textContent=
   battingTeam?.short_name||battingTeam?.name||"BATTING";

  $("bowlTeam").textContent=
   bowlingTeam?.short_name||bowlingTeam?.name||"BOWLING";

  setLogo(
   "batLogo","batInitial",
   battingTeam?.logo_url,
   battingTeam?.short_name||battingTeam?.name
  );

  setLogo(
   "bowlLogo","bowlInitial",
   bowlingTeam?.logo_url,
   bowlingTeam?.short_name||bowlingTeam?.name
  );

  /* MAIN SCORE */
  $("score").textContent=runs+"/"+wickets;
  $("overs").textContent=overText(balls)+" OV";

  const crr=balls?(runs/(balls/6)):0;
  $("crr").textContent=crr.toFixed(2);

  const totalOvers=Number(m.overs||20);
  const projected=Math.round(crr*totalOvers);

  $("projected").textContent=projected;

  /* TARGET AND RRR */
  const target=Number(inn.target||0);
  const ballsRemaining=Math.max(0,totalOvers*6-balls);

  $("target").textContent=target||"--";

  $("rrr").textContent=
   target&&ballsRemaining?
   (Math.max(0,target-runs)/(ballsRemaining/6)).toFixed(2)
   :"--";

  /* PLAYER INFORMATION */
  const {data:players,error:pe}=await db
   .from("gfc_players")
   .select("id,name");

  if(pe)throw pe;

  const pm={};
  (players||[]).forEach(p=>pm[p.id]=p);

  const latest=[...ds].reverse().find(d=>
   d.striker_id||d.non_striker_id||d.bowler_id
  );

  const sid=latest?.striker_id;
  const nid=latest?.non_striker_id;
  const bid=latest?.bowler_id;

  const s=batter(ds,sid);
  const n=batter(ds,nid);
  const b=bowlerFigures(ds,bid);

  $("striker").textContent=pm[sid]?.name||"Striker";
  $("nonStriker").textContent=pm[nid]?.name||"Non Striker";

  $("strikerRuns").textContent=s.r;
  $("strikerBalls").textContent=s.b;

  $("nonRuns").textContent=n.r;
  $("nonBalls").textContent=n.b;

  $("bowler").textContent=pm[bid]?.name||"Bowler";

  $("bowlerStats").textContent=
   b.w+"/"+b.r+" ("+overText(b.b)+")";

  /* LAST BALLS */
  renderLastBalls(ds);

 }catch(e){
  console.error("GFC Scorebar:",e);
 }finally{
  refreshing=false;
 }
}

refresh();
setInterval(refresh,3000);
</script>
</body>
</html>
