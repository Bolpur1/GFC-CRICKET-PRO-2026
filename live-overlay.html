<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:transparent;color:white;font-family:Arial,sans-serif}
body{padding:12px}

.right{text-align:right}
.brand{font-size:10px;letter-spacing:2px;margin-bottom:5px;font-weight:bold}
.bottom{display:flex;justify-content:space-between;gap:10px;padding:9px 20px;font-size:clamp(11px,1.8vw,15px);font-weight:900}
#status{text-align:center;font-size:10px;padding:5px;opacity:.7}
.accent{font-weight:1000}

/* 01 ROYAL BLUE */

/* 05 NEON STRIKE */

/* 12 SILVER ELITE */

/* 13 CYBER LEAGUE */
.cyber .card{background:#130b24;border-color:#eaff00}
.cyber .top{background:linear-gradient(100deg,#4b176c,#110b24)}
.cyber .score,.cyber .accent{color:#eaff00}

/* 14 ROYAL PURPLE */
.stadium .card{background:#180b36;border-color:#d1a3ff}
.stadium .top{background:linear-gradient(100deg,#54208b,#1a0c38)}
.stadium .score,.stadium .accent{color:#e0bdff}

/* 15 MIDNIGHT GOLD */
.minimal .card{background:#080b14;border-color:#caa64b}
.minimal .top{background:linear-gradient(100deg,#252b3a,#080b14)}

/* 16 FIREBALL */

.retro .top{background:linear-gradient(100deg,#a9360a,#391007)}
.retro .score,.retro .accent{color:#ffcf68}

/* 17 SUPER SIXES */
.tv .card{background:#101010;border:3px solid #f4f4f4}
.tv .top{background:linear-gradient(100deg,#343434,#111)}
.tv .score,.tv .accent{color:#f7ec63}

/* 18 POWERPLAY PRO */
.gradient .card{background:#0a1738;border-color:#5de3e9}
.gradient .top{background:linear-gradient(100deg,#125c9b,#452078,#071a36)}
.gradient .score,.gradient .accent{color:#7df8ef}

/* 19 CHAMPIONSHIP */
.league .card{background:#101d35;border-color:#ffbd45}
.league .top{background:linear-gradient(100deg,#243e71,#111d36)}
.league .score,.league .accent{color:#ffd06b}

/* 20 GRAND FINALE */
.matrix .card{background:#00190c;border-color:#8bff48}
.matrix .top{background:linear-gradient(100deg,#07522b,#001b0c)}

@media(max-width:450px){
 body{padding:4px}
 .top{padding:10px}

<body>

<div id="scoreboard" class="classic">
 <div class="card">
  <div class="top">
   <div>
    <div class="brand">🏏 GFC CRICKET PRO 2026</div>
    <div class="teams" id="teams">TEAM A vs TEAM B</div>
    <div class="details" id="matchInfo">LIVE MATCH</div>
   </div>
   <div class="right">
    <div class="score" id="score">0/0</div>
    <div class="details" id="overs">0.0 OVERS</div>
   </div>
  </div>
  <div class="bottom">
   <span id="runrate">RUN RATE 0.00</span>
   <span class="accent" id="target">GFC LIVE</span>
  </div>
 </div>
 <div id="status">GFC CRICKET PRO 2026 • LIVE</div>
</div>

<script>
const SUPABASE_URL="https://shlvtaxrkyffdifbjswq.supabase.co";
const SUPABASE_KEY="sb_publishable_m11Q7ccOj1iQf_HB1zZ4bg_0GpxW0lC";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params=new URLSearchParams(location.search);
const matchId=params.get("match");
const design=params.get("design")||"classic";

const allowed=[
 "classic","modern","red","gold","neon","purple","orange",
 "royal","blackgold","emerald","pink","ice","cyber",
 "stadium","minimal","retro","tv","gradient","league","matrix"
];

const $=id=>document.getElementById(id);

$("scoreboard").className=
 allowed.includes(design)?design:"classic";

function calculate(list){
 let runs=0,wickets=0,balls=0;

 list.forEach(d=>{
  runs+=Number(d.batter_runs||0)+Number(d.extra_runs||0);

  if(d.is_wicket)wickets++;

  if(!["wide","no_ball"].includes(d.extra_type||"none")){
   balls++;
  }
 });

 return {runs,wickets,balls};
}

function overText(balls){
 return Math.floor(balls/6)+"."+balls%6;
}

function runRate(t){
 return t.balls?
  (t.runs/(t.balls/6)).toFixed(2):
  "0.00";
}

async function refresh(){

 try{

  if(!matchId){
   $("status").textContent="MATCH ID NOT PROVIDED";
   return;
  }

  const {data:m,error:me}=await db
   .from("gfc_matches")
   .select("*")
   .eq("id",matchId)
   .single();

  if(me)throw me;

  const {data:teamData,error:te}=await db
   .from("gfc_teams")
   .select("*")
   .in("id",[m.team_a_id,m.team_b_id]);

  if(te)throw te;

  const teamName=id=>{
   const t=(teamData||[]).find(x=>x.id===id);
   return t?.short_name||t?.name||"TEAM";
  };

  const {data:inn,error:ie}=await db
   .from("gfc_innings")
   .select("*")
   .eq("match_id",matchId)
   .order("innings_no",{ascending:false})
   .limit(1);

  if(ie)throw ie;

  const current=inn?.[0];
  let deliveries=[];

  if(current){
   const {data:d,error:de}=await db
    .from("gfc_deliveries")
    .select("*")
    .eq("innings_id",current.id)
    .order("created_at",{ascending:true});

   if(de)throw de;
   deliveries=d||[];
  }

  const t=calculate(deliveries);

  $("teams").textContent=
   teamName(m.team_a_id)+" vs "+teamName(m.team_b_id);

  $("matchInfo").textContent=
   (m.venue||"GFC MATCH")+" • "+(m.status||"LIVE").toUpperCase();

  $("score").textContent=t.runs+"/"+t.wickets;
  $("overs").textContent=overText(t.balls)+" OVERS";
  $("runrate").textContent="RUN RATE "+runRate(t);

  $("target").textContent=
   current?.target?"TARGET "+current.target:"GFC CRICKET PRO 2026";

  $("status").textContent="● GFC LIVE SCORE";

 }catch(e){
  console.error(e);
  $("status").textContent="SCORE LOADING...";
 }
}

refresh();
setInterval(refresh,3000);
</script>
</body>
</html>
