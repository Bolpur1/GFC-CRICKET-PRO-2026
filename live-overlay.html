<html lang="en">

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 width:100%;
 height:100%;
 background:transparent;
 font-family:Arial,Helvetica,sans-serif;
 color:#fff
}

body{
 display:flex;
 align-items:flex-end;
 justify-content:center;
 overflow:hidden
}

/* IMPORTANT: Do not put theme variables here.
   Theme variables are controlled by the selected class. */
#broadcast{
 width:100%;
 padding:0 1%;
}

.bar{
 width:100%;
 min-height:72px;
 display:flex;
 align-items:stretch;
 position:relative;
 overflow:hidden;
 border-top:3px solid var(--accent);
 border-radius:7px 7px 0 0;
 background:linear-gradient(105deg,var(--main),var(--mid) 43%,var(--deep));
 box-shadow:0 -5px 22px #000a,inset 0 1px 0 #ffffff35;
}

.bar:before{
 content:"";
 position:absolute;
 inset:0;
 pointer-events:none;
 background:linear-gradient(115deg,var(--shine),transparent 30%,#ffffff05 65%,transparent);
}

.bar:after{
 content:"";
 position:absolute;
 inset:0;
 pointer-events:none;
 opacity:.12;
 background:repeating-linear-gradient(135deg,transparent 0 18px,#fff 19px 20px,transparent 21px 38px);
}

#broadcast .team,
#broadcast .batsmen,
#broadcast .main-score,
#broadcast .bowler,
#broadcast .last{
 z-index:1
}

/* TEAM PANELS */
.team{
 display:flex;
 align-items:center;
 gap:8px;
 padding:0 12px;
 min-width:130px;
 max-width:155px;
 background:linear-gradient(145deg,var(--panel),var(--deep));
 position:relative
}

.team.batting{
 border-left:3px solid var(--accent);
 border-right:1px solid var(--line)
}

.team.bowling{
 border-left:1px solid var(--line);
 border-right:3px solid var(--accent)
}

.logo{
 width:39px;
 height:39px;
 flex:0 0 39px;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:50%;
 overflow:hidden;
 background:linear-gradient(145deg,var(--main),var(--deep));
 border:2px solid var(--accent);
 box-shadow:0 0 10px var(--glow);
 color:var(--accent);
 font-size:11px;
 font-weight:1000
}

.logo img{
 width:100%;
 height:100%;
 object-fit:contain;
 display:none;
 background:#fff;
 border-radius:50%
}

.teamname{
 font-size:11px;
 font-weight:1000;
 line-height:1.2;
 max-width:90px;
 overflow:hidden;
 text-overflow:ellipsis;
 white-space:nowrap
}

.teamtag{
 font-size:8px;
 color:var(--accent);
 font-weight:900;
 letter-spacing:1.2px;
 margin-top:5px
}

/* BATSMEN */
.batsmen{
 display:flex;
 flex-direction:column;
 justify-content:center;
 gap:7px;
 min-width:185px;
 padding:0 12px;
 border-right:1px solid var(--line);
 position:relative
}

.batter{
 display:flex;
 align-items:center;
 gap:6px;
 min-width:0
}

.batter-name{
 display:flex;
 align-items:center;
 gap:5px;
 min-width:0;
 font-size:10px;
 font-weight:900;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 max-width:105px
}

.strike-icon{
 color:var(--accent);
 font-size:10px
}

.batter:not(.on-strike) .strike-icon{
 display:none
}

.batter-stats{
 font-size:10px;
 color:var(--light);
 white-space:nowrap;
 font-weight:800;
 margin-left:auto
}

.batter-stats strong{
 color:var(--accent);
 font-size:12px
}

/* MAIN SCORE */
.main-score{
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 min-width:210px;
 padding:4px 14px;
 background:linear-gradient(145deg,var(--score-panel),var(--deep));
 border-right:1px solid var(--line);
 position:relative
}

.score-line{
 display:flex;
 align-items:baseline;
 justify-content:center;
 gap:5px
}

.score{

 line-height:1;
 font-weight:1000;
 letter-spacing:-1px;
 color:var(--accent);
 text-shadow:0 0 14px var(--glow);
 white-space:nowrap
}

.overs{
 font-size:10px;
 font-weight:900;
 color:var(--light);
 white-space:nowrap
}

.score-caption{
 font-size:7px;
 letter-spacing:2px;
 color:var(--light);
 opacity:.72;
 font-weight:900;
 margin-top:3px
}

.score-metrics{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:9px;
 margin-top:5px;
 width:100%
}

.metric{
 text-align:center;
 white-space:nowrap
}

.metric small{
 display:block;
 font-size:7px;
 color:var(--light);
 opacity:.85;
 font-weight:900;
 letter-spacing:.5px;
 margin-bottom:2px
}

.metric b{
 font-size:10px;
 color:var(--accent);
 font-weight:1000
}

.metric-separator{

 width:1px;
 background:var(--line)

/* BOWLER */
.bowler{

 justify-content:center;

 max-width:135px;
 padding:0 11px;
 border-right:1px solid var(--line);
 position:relative

.bowler small{

 color:var(--accent);
 font-weight:1000;
 letter-spacing:1px;
 margin-bottom:5px

.bowler b{

 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis

.bowler span{

 font-weight:800

.last{

 align-items:center;

 padding:0 9px;

 min-width:100px;

.last-title{

 font-weight:1000;

 letter-spacing:.8px;
 white-space:nowrap

#lastBalls{

 align-items:center;

.ball{

 display:flex;
 align-items:center;
 justify-content:center;

 font-size:9px;
 font-weight:1000;

<script>
/* SUPABASE CONFIGURATION */

const SUPABASE_URL="https://shlvtaxrkyffdifbjswq.supabase.co";
const SUPABASE_KEY="sb_publishable_m11Q7ccOj1iQf_HB1zZ4bg_0GpxW0lC";

const db=window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

/* ELEMENT SELECTOR */

const $=id=>document.getElementById(id);

/* URL PARAMETERS */

const params=new URLSearchParams(location.search);
const matchId=params.get("match");
const design=params.get("design")||"classic";

/* 30 SELECTABLE THEMES */

const themes=[
 "classic","modern","red","gold","neon",
 "purple","orange","royal","blackgold","emerald",
 "pink","ice","cyber","stadium","minimal",
 "retro","tv","gradient","league","matrix",
 "arctic","crimson","diamond","tropical","maroon",
 "sunset","galaxy","lime","copper","ocean"
];

/* APPLY SELECTED THEME */

const broadcast=$("broadcast");

broadcast.className=themes.includes(design)
 ?design
 :"classic";

/* CRICKET HELPERS */

function overText(b){
 b=Number(b||0);
 return Math.floor(b/6)+"."+(b%6);
}

function legal(d){
 return !["wide","no_ball"].includes(
  (d.extra_type||"none").toLowerCase()
 );
}

function extras(d){
 return Number(d.extra_runs||0);
}

/* TOTAL INNINGS SCORE */

function scoreOf(ds){
 let r=0,w=0,b=0;

 ds.forEach(d=>{
  r+=Number(d.batter_runs||0)+extras(d);

  if(d.is_wicket)w++;
  if(legal(d))b++;
 });

 return {r,w,b};
}

/* BATSMAN STATISTICS */

function batter(ds,id){
 let r=0,b=0;

 ds.forEach(d=>{
  if(!id||d.striker_id!==id)return;

  r+=Number(d.batter_runs||0);

  if((d.extra_type||"none").toLowerCase()!=="wide"){
   b++;
  }
 });

 return {r,b};
}

/* BOWLER STATISTICS */

function bowlerFigures(ds,id){
 let r=0,w=0,b=0;

 ds.forEach(d=>{
  if(!id||d.bowler_id!==id)return;

  const type=(d.extra_type||"none").toLowerCase();

  r+=Number(d.batter_runs||0);

  if(type==="wide"||type==="no_ball"){
   r+=extras(d);
  }

  if(legal(d))b++;

  if(
   d.is_wicket &&
   ![
    "run out",
    "retired hurt",
    "obstructing the field",
    "retired out"
   ].includes((d.wicket_type||"").toLowerCase())
  ){
   w++;
  }
 });

 return {r,w,b};
}

/* BALL TEXT */

function ballText(d){
 if(d.is_wicket)return "W";

 const r=Number(d.batter_runs||0);
 const e=extras(d);
 const type=(d.extra_type||"none").toLowerCase();

 if(type==="wide")return "Wd";
 if(type==="no_ball")return "Nb";
 if(type==="bye")return "B"+e;
 if(type==="leg_bye")return "Lb"+e;

 return String(r);
}

/* BALL COLOURS */

function ballClass(d){
 if(d.is_wicket)return "wicket";

 const type=(d.extra_type||"none").toLowerCase();

 if(type==="wide")return "wide";
 if(type==="no_ball")return "noball";

 if(type==="bye"||type==="leg_bye"){
  return "extra";
 }

 const r=Number(d.batter_runs||0);

 if(r===0)return "dot";
 if(r===1)return "one";
 if(r===2)return "two";
 if(r===3)return "three";
 if(r===4)return "four";
 if(r===6)return "six";

 return "other";
}

/* TEAM LOGO */

function setLogo(imageId,initialId,url,name){

 const img=$(imageId);
 const fallback=$(initialId);

 fallback.textContent=(name||"GFC")
  .trim()
  .substring(0,3)
  .toUpperCase();

 if(!url){
  img.style.display="none";
  fallback.style.display="block";
  return;
 }

 const current=img.getAttribute("data-logo-url");

 if(current===url){

  if(img.complete&&img.naturalWidth>0){
   img.style.display="block";
   fallback.style.display="none";
  }

  return;
 }

 img.setAttribute("data-logo-url",url);

 img.style.display="none";
 fallback.style.display="block";

 img.onload=()=>{
  img.style.display="block";
  fallback.style.display="none";
 };

 img.onerror=()=>{
  img.style.display="none";
  fallback.style.display="block";
 };

 img.src=url;
}

/* LAST SIX LEGAL BALLS + EXTRA DELIVERIES */

function renderLastBalls(ds){

 const legalIndexes=[];

 ds.forEach((d,i)=>{
  if(legal(d))legalIndexes.push(i);
 });

 const lastSix=legalIndexes.slice(-6);

 const selected=lastSix.length
  ?ds.slice(lastSix[0])
  :ds.slice(-6);

 $("lastBalls").innerHTML=selected.length
  ?selected.map(d=>
    `<span class="ball ${ballClass(d)}" title="${ballText(d)}">${ballText(d)}</span>`
   ).join("")
  :'<span class="ball dot">-</span>';
}

/* REFRESH CONTROL */

let refreshing=false;

async function refresh(){

 if(refreshing)return;

 refreshing=true;

 try{

  if(!matchId){
   throw new Error("Missing match ID in URL");
  }

  /* MATCH */

  const {data:m,error:me}=await db
   .from("gfc_matches")
   .select("*")
   .eq("id",matchId)
   .single();

  if(me)throw me;

  /* TEAMS */

  const {data:teams,error:te}=await db
   .from("gfc_teams")
   .select("*")
   .in("id",[m.team_a_id,m.team_b_id]);

  if(te)throw te;

  const tm={};

  (teams||[]).forEach(t=>{
   tm[t.id]=t;
  });

  /* LATEST INNINGS */

  const {data:innings,error:ie}=await db
   .from("gfc_innings")
   .select("*")
   .eq("match_id",matchId)
   .order("innings_no",{ascending:false})
   .limit(1);

  if(ie)throw ie;

  const inn=innings?.[0];

  if(!inn)return;

  /* DELIVERIES */

  const {data:ds0,error:de}=await db
   .from("gfc_deliveries")
   .select("*")
   .eq("innings_id",inn.id)
   .order("created_at",{ascending:true});

  if(de)throw de;

  const ds=ds0||[];
  const calc=scoreOf(ds);

  /* CURRENT SCORE */

  const runs=Number(inn.total_runs??calc.r);
  const wickets=Number(inn.wickets??calc.w);
  const balls=Number(inn.legal_balls??calc.b);

  /* BATTING AND BOWLING TEAMS */

  const battingId=
   inn.batting_team_id||
   m.batting_team_id||
   m.team_a_id;

  const bowlingId=
   battingId===m.team_a_id
    ?m.team_b_id
    :m.team_a_id;

  const battingTeam=tm[battingId];
  const bowlingTeam=tm[bowlingId];

  /* TEAM NAMES */

  $("batTeam").textContent=
   battingTeam?.short_name||
   battingTeam?.name||
   "BATTING";

  $("bowlTeam").textContent=
   bowlingTeam?.short_name||
   bowlingTeam?.name||
   "BOWLING";

  /* TEAM LOGOS */

  setLogo(
   "batLogo",
   "batInitial",
   battingTeam?.logo_url,
   battingTeam?.short_name||battingTeam?.name
  );

  setLogo(
   "bowlLogo",
   "bowlInitial",
   bowlingTeam?.logo_url,
   bowlingTeam?.short_name||bowlingTeam?.name
  );

  /* MAIN SCORE */

  $("score").textContent=runs+"/"+wickets;
  $("overs").textContent=overText(balls)+" OV";

  /* CRR */

  const crr=balls
   ?runs/(balls/6)
   :0;

  $("crr").textContent=crr.toFixed(2);

  /* PROJECTED SCORE */

  const totalOvers=Number(m.overs||20);

  $("projected").textContent=
   Math.round(crr*totalOvers);

  /* TARGET AND RRR */

  const target=Number(inn.target||0);

  const ballsRemaining=Math.max(
   0,
   totalOvers*6-balls
  );

  $("target").textContent=target||"--";

  $("rrr").textContent=
   target&&ballsRemaining
    ?(
      Math.max(0,target-runs)/
      (ballsRemaining/6)
     ).toFixed(2)
    :"--";

  /* PLAYERS */

  const {data:players,error:pe}=await db
   .from("gfc_players")
   .select("id,name");

  if(pe)throw pe;

  const pm={};

  (players||[]).forEach(p=>{
   pm[p.id]=p;
  });

  /* LATEST ACTIVE PLAYERS */

  const latest=[...ds]
   .reverse()
   .find(d=>
    d.striker_id||
    d.non_striker_id||
    d.bowler_id
   );

  const sid=latest?.striker_id;
  const nid=latest?.non_striker_id;
  const bid=latest?.bowler_id;

  /* BATSMAN FIGURES */

  const s=batter(ds,sid);
  const n=batter(ds,nid);

  /* BOWLER FIGURES */

  const b=bowlerFigures(ds,bid);

  $("striker").textContent=
   pm[sid]?.name||"Striker";

  $("nonStriker").textContent=
   pm[nid]?.name||"Non Striker";

  $("strikerRuns").textContent=s.r;
  $("strikerBalls").textContent=s.b;

  $("nonRuns").textContent=n.r;
  $("nonBalls").textContent=n.b;

  $("bowler").textContent=
   pm[bid]?.name||"Bowler";

  $("bowlerStats").textContent=
   b.w+"/"+b.r+" ("+overText(b.b)+")";

  /* LAST SIX BALLS */

  renderLastBalls(ds);

 }catch(e){

  console.error("GFC Scorebar:",e);

 }finally{

  refreshing=false;

 }
}

/* INITIAL LOAD */

refresh();

/* AUTO REFRESH EVERY 3 SECONDS */

setInterval(refresh,3000);

</script>
